    // stepper : a -> Event a -> Moment (Behavior a)

    // Re-implementation plan for chronomancy.js and html.js:
    // Goal: produce a clear, correct, and readable reference implementation first,
    // then optimize for performance only where measurements show a need.
    //
    // Steps:
    // 1) Inventory the public APIs used by frpExample (chronomancy.js exports and
    //    html.js helpers). Write a concise spec of each function's contract.
    // 2) Implement core FRP primitives (unoptimized, reference-quality):
    //    - Event and Behavior constructors, input, never
    //    - mapE, filter, merge, mapB, apply, tag, mapTag
    //    - stepper, loopEvent, loopBehavior, switchE, mergeBind
    //    - observeE and output (Moment scheduling / transactional semantics)
    // 3) Add a simple scheduler / Moment implementation ensuring deterministic
    //    update order and no extra allocations (clarify ordering rules in comments).
    // 4) Implement html.js on top of those primitives: DOM element wrappers,
    //    inputs/buttons/pull/table helpers, and utility combinators used by examples.
    // 5) Port the frpExample interactive examples and run them as tests.
    // 6) Write microbenchmarks for hot paths (table updates, many listeners).
    // 7) Iterate: fix correctness issues found by examples/tests, then optimize.
    //
    // Optimization note (many children/parents):
    // - Do not prematurely optimize. Complete a correct unoptimized version first.
    // - If benchmarks show pain points when sinks/sources have large fan-in/fan-out,
    //   consider these targeted optimizations:
    //     * Batch attach/detach APIs for adding/removing many children at once.
    //     * Use compact arrays or typed arrays for listener lists and recycle slots
    //       instead of creating lots of short-lived closures.
    //     * Delta propagation: only notify dependents with actual changes.
    //     * Hierarchical grouping of listeners to reduce traversal cost.
    //     * Use weak maps or explicit dispose APIs to avoid leaks from many edges.
    // - Measure before and after; optimize specific hot spots (e.g., table diffs)
    //   rather than the general case.
    //
    // Recommendation: implement the unoptimized reference, add tests and
    // benchmarks, then apply focused optimizations with measurable gains.

    // Documentation plan: series of HTML "views" that demonstrate each combinator.
    // Style: match generator-based html.js usage from frpExample/index.html.
    // Each view below is described and given a placeholder generator function name.
    // Implementations should be small generator functions that yield html controls
    // and wire example reactives together so users can interact and observe results.
    //
    // Overview of planned views:
    // 1) Basics: input, never, mapE, filter
    //    - UI: a text input and two buttons (emit, clear). Live list of emitted values.
    //    - Show mapE (transform input), filter (drop empty or short strings), never used

    //    - Placeholder: function* view_basics() { /* use input, mapE, filter */ }
    //
    // 2) Merging & conflict resolution: merge
    //    - UI: two independent counters (buttons) producing Event<number>.

    //    - Show timeline / recent events. Placeholder: function* view_merge() {}
    //
    // 3) Behaviors and applying: mapB, apply, stepper
    //    - UI: a slider (Behavior<number>) and a text field showing mapped value.
    //    - Demonstrate stepper to convert an Event into a Behavior, then mapB/apply

    //    - Placeholder: function* view_behaviors() {}
    //
    // 4) Tagging and mapTag: tag, mapTag
    //    - UI: event of clicks + a live behavior (e.g., current timestamp or counter).
    //    - Use tag to capture the behavior value at event time; mapTag to combine.
    //    - Placeholder: function* view_tagging() {}
    //
    // 5) Higher-order events: switchE, mergeBind, observeE
    //    - UI: controls to spawn child event streams (e.g., per-session events).
    //    - Demonstrate switchE to follow most recent child Event, mergeBind to flatten
    //      with custom mapping, and observeE for executing Moment-producing events.
    //    - Placeholder: function* view_higher_order() {}
    //
    // 6) Looping and state: loopEvent, loopBehavior, mergeBind usage for state machines
    //    - UI: a small state machine (traffic-light or counter with reset) implemented
    //      using loopBehavior/loopEvent and stepper to keep internal state.
    //    - Show how to expose events for external control and observe state changes.
    //    - Placeholder: function* view_loops() {}
    //
    // 7) IO and outputs: output, observeE, and integration with DOM
    //    - UI: demonstrate output to console or a log area when events fire.
    //    - Show observeE converting Event(Moment a) to Event a and then output.
    //    - Placeholder: function* view_io() {}
    //
    // 8) Composite examples: combining combinators in a small app
    //    - Recreate a simplified version of the frpExample user-table: inputs,
    //      signups, table behavior, merges and tagging. This is a "capstone" view
    //      that links many combinators together. Placeholder: function* view_app() {}
    //
    // Implementation notes and conventions (for contributor reference):
    // - Each view is a generator function* that yields html controls (see html.js API).
    // - Views should expose a simple start function: startView(container, viewGenerator)

    // - For each combinator demonstration include:
    //     * Short prose comment describing the goal and the reactive wiring.
    //     * Minimal wiring code showing the combinators in use (mapE, merge, stepper,

    //

    // - Keep examples in this index.html for simplicity, following frpExample style.
    // - Alternatively move detailed examples into examples/*.html or examples/*.js

    //
    // Next steps for implementation:

    // - Wire a navigation list that switches between views using loopEvent/switchE.
    // - Implement 1-2 full views (Basics and Behaviors) first as runnable examples.
